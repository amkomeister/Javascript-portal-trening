name: Verify school delivery
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: school-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/setup.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm test:preview
      - run: pnpm test:emulator
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build the production container
        run: docker build --tag kodeverkstad-test .
      - name: Refuse missing production configuration
        run: |
          if docker run --rm kodeverkstad-test; then
            echo 'An unconfigured production container must not start.'
            exit 1
          fi
      - name: Check the production HTTP boundary without real accounts or data
        run: |
          docker run --detach --name school-smoke --publish 127.0.0.1:8080:8080 \
            --env GOOGLE_CLIENT_ID=synthetic.apps.googleusercontent.com \
            --env GOOGLE_CLOUD_PROJECT=demo-school-container \
            --env ALLOWED_DOMAINS=school.example \
            --env APP_ORIGIN=https://school.example \
            kodeverkstad-test
          node scripts/smoke-production.mjs http://127.0.0.1:8080
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs school-smoke 2>/dev/null || true
          docker rm --force school-smoke 2>/dev/null || true
